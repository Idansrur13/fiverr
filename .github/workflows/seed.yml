name: Seed database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "seed" to load the demo data into the production database
        required: true

concurrency:
  group: seed-database
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      CONFIRM: ${{ inputs.confirm }}

    steps:
      - name: Check confirmation and secrets
        run: |
          if [ "$CONFIRM" != "seed" ]; then
            echo "::error::Type \"seed\" in the confirm field to run this workflow"
            exit 1
          fi
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
            echo "::error::Add the DATABASE_URL and DIRECT_URL secrets under Settings > Secrets and variables > Actions"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npx prisma db seed
